<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>robonky | Music by Robin van den Heuvel</title>
    <meta name="description" content="robonky — AI-produced music by Robin van den Heuvel. Listen on Spotify.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #e8e8e8;
            --accent: #1DB954;
            --muted: #6a6a6a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .noise {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 2rem;
            max-width: 520px;
        }
        .artist-name {
            font-family: 'Space Mono', monospace;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeUp 0.8s ease-out both;
        }
        .real-name {
            font-size: 1rem;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            animation: fadeUp 0.8s ease-out 0.15s both;
        }
        .divider {
            width: 40px;
            height: 2px;
            background: var(--accent);
            margin: 0 auto 2.5rem;
            animation: fadeUp 0.8s ease-out 0.3s both;
        }
        .bio {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.7;
            color: var(--muted);
            margin-bottom: 2.5rem;
            animation: fadeUp 0.8s ease-out 0.4s both;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
            animation: fadeUp 0.8s ease-out 0.5s both;
        }
        .links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.5rem;
            border: 1px solid #222;
            border-radius: 4px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            transition: all 0.25s ease;
        }
        .links a:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .links a.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 700;
        }
        .links a.primary:hover {
            background: #1ed760;
            border-color: #1ed760;
            color: #000;
        }
        .contact {
            font-size: 0.85rem;
            color: var(--muted);
            animation: fadeUp 0.8s ease-out 0.6s both;
        }
        .contact a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--muted);
            transition: border-color 0.25s;
        }
        .contact a:hover { border-color: var(--accent); }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="container">
        <h1 class="artist-name">robonky</h1>
        <p class="real-name">Robin van den Heuvel</p>
        <div class="divider"></div>
        <p class="bio">AI-produced music. Human-directed creativity.</p>
        <div class="links">
            <a href="https://open.spotify.com/artist/29uPjLGhUIdrLN5IB9HX25" class="primary" target="_blank" rel="noopener noreferrer">Listen on Spotify</a>
            <a href="https://x.com/RobinHill85" target="_blank" rel="noopener noreferrer">X / Twitter</a>
            <a href="https://www.linkedin.com/in/robinmarketing/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
        <p class="contact">Contact: <a href="mailto:robin@overxceed.com">robin@overxceed.com</a></p>
    </div>
</body>
</html>
